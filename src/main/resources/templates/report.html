<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BudgetBuddy – Laporan Bulanan</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

<input type="hidden" id="_userId"   th:value="${userId}"/>
<input type="hidden" id="_username" th:value="${username}"/>

<nav class="navbar">
  <a href="/dashboard" class="navbar-brand">Budget<span>Buddy</span></a>
  <div class="nav-links">
    <a href="/dashboard"     class="nav-link">📊 Dashboard</a>
    <a href="/transactions"  class="nav-link">📋 Transaksi</a>
    <a href="/report"        class="nav-link">📈 Laporan</a>
    <a href="/categories"    class="nav-link">🏷️ Kategori</a>
  </div>
  <div class="navbar-user">
    <span>👋 <strong id="navUsername"></strong></span>
    <button onclick="doLogout()">Keluar</button>
  </div>
</nav>

<div class="page-content">
  <div class="section-header"><h2>Laporan Bulanan</h2></div>

  <div class="report-filter">
    <div class="form-group">
      <label>Bulan</label>
      <select id="reportMonth">
        <option value="1">Januari</option><option value="2">Februari</option>
        <option value="3">Maret</option><option value="4">April</option>
        <option value="5">Mei</option><option value="6">Juni</option>
        <option value="7">Juli</option><option value="8">Agustus</option>
        <option value="9">September</option><option value="10">Oktober</option>
        <option value="11">November</option><option value="12">Desember</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tahun</label>
      <input type="number" id="reportYear" min="2020" max="2099"/>
    </div>
    <button class="btn btn-primary" style="white-space:nowrap" onclick="loadReport()">Lihat Laporan</button>
  </div>

  <div id="reportResult" class="hidden">
    <div class="report-summary">
      <div class="summary-card income">
        <div class="label">Total Pemasukan</div>
        <div class="value" id="repIncome">Rp 0</div>
      </div>
      <div class="summary-card expense">
        <div class="label">Total Pengeluaran</div>
        <div class="value" id="repExpense">Rp 0</div>
      </div>
      <div class="summary-card balance">
        <div class="label">Saldo Akhir</div>
        <div class="value" id="repBalance">Rp 0</div>
      </div>
    </div>
    <div class="tx-list">
      <div class="report-tx-header">Detail Transaksi</div>
      <div id="reportTxList"></div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  const userId = document.getElementById('_userId').value;
  document.getElementById('navUsername').textContent = document.getElementById('_username').value;

  const now = new Date();
  document.getElementById('reportMonth').value = now.getMonth() + 1;
  document.getElementById('reportYear').value  = now.getFullYear();

  async function loadReport() {
    const month = document.getElementById('reportMonth').value;
    const year  = document.getElementById('reportYear').value;
    try {
      const r = await api('GET', `/reports/monthly?userId=${userId}&month=${month}&year=${year}`);
      if (!r) return;
      document.getElementById('repIncome').textContent  = fmt(r.totalIncome);
      document.getElementById('repExpense').textContent = fmt(r.totalExpense);
      document.getElementById('repBalance').textContent = fmt(r.balance);
      document.getElementById('reportResult').classList.remove('hidden');
      renderTxList(r.transactions);
    } catch(e) { toast(e.message, 'error'); }
  }

  function renderTxList(txs) {
    const el = document.getElementById('reportTxList');
    if (!txs || txs.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>Tidak ada transaksi bulan ini</div></div>';
      return;
    }
    el.innerHTML = txs.map(t => {
      const isIncome = t.type === 'INCOME';
      const meta = isIncome ? `${t.date} · ${t.source||'Pemasukan'}` : `${t.date} · ${t.categoryName||'Pengeluaran'}`;
      return `<div class="tx-item">
        <div class="tx-icon ${isIncome?'income':'expense'}">${isIncome?'💰':'💸'}</div>
        <div class="tx-info"><div class="desc">${t.description||'-'}</div><div class="meta">${meta}</div></div>
        <div class="tx-amount ${isIncome?'income':'expense'}">${isIncome?'+':'-'} ${fmt(t.amount)}</div>
      </div>`;
    }).join('');
  }

  loadReport();
</script>
</body>
</html>
